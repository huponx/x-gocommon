name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Summary
        if: success()
        run: |
          {
            echo "## Test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | passed |"
            echo "| Go | $(go version | tr -s ' ') |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Event | ${{ github.event_name }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          write_summary() {
            {
              echo "## Release"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Status | ${1} |"
              echo "| Tag | ${2} |"
              echo "| Bump | ${BUMP} |"
              echo "| Previous | ${3} |"
              echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
              if [ -n "${4:-}" ]; then
                echo "| URL | ${4} |"
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "${existing}" ]; then
            echo "HEAD already has a semver tag; skipping release"
            write_summary "skipped (HEAD already tagged)" "${existing}" "${existing}" ""
            exit 0
          fi

          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            tag="v0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "${BUMP}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "unknown bump: ${BUMP}" >&2
                exit 1
                ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi

          echo "Creating ${tag} (bump=${BUMP}, previous=${latest:-none})"
          url="$(gh release create "${tag}" --generate-notes --target "${GITHUB_SHA}")"
          write_summary "created" "${tag}" "${latest:-none}" "${url}"
