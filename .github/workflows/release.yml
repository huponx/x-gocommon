name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - '**/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.commit_modules.outputs.release_sha }}
      modules: ${{ steps.commit_modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tidy modules
        run: go mod tidy
      - name: Download modules
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Commit go.sum
        id: commit_modules
        run: |
          set -euo pipefail
          echo "release_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet go.mod go.sum; then
            echo "modules=clean" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          # [skip ci] so this push does not start a second Release run.
          git commit -m "chore: go mod tidy [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "modules=committed" >> "${GITHUB_OUTPUT}"
      - name: Summary
        if: success()
        run: |
          {
            echo "## Test"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Result | passed |"
            echo "| Modules | ${{ steps.commit_modules.outputs.modules }} |"
            echo "| Go | $(go version | tr -s ' ') |"
            echo "| Trigger | \`${GITHUB_SHA:0:7}\` |"
            echo "| Release SHA | \`${{ steps.commit_modules.outputs.release_sha }}\` |"
            echo "| Event | ${{ github.event_name }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          RELEASE_SHA: ${{ needs.test.outputs.release_sha }}
        run: |
          set -euo pipefail

          git fetch origin "${GITHUB_REF_NAME}" --tags

          write_summary() {
            {
              echo "## Release"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Status | ${1} |"
              echo "| Tag | ${2} |"
              echo "| Bump | ${BUMP} |"
              echo "| Previous | ${3} |"
              echo "| Commit | \`${RELEASE_SHA:0:7}\` |"
              if [ -n "${4:-}" ]; then
                echo "| URL | ${4} |"
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          existing="$(git tag --points-at "${RELEASE_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "${existing}" ]; then
            echo "Release SHA already has a semver tag; skipping release"
            write_summary "skipped (commit already tagged)" "${existing}" "${existing}" ""
            exit 0
          fi

          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            tag="v0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "${BUMP}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "unknown bump: ${BUMP}" >&2
                exit 1
                ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi

          echo "Creating ${tag} (bump=${BUMP}, previous=${latest:-none}, target=${RELEASE_SHA})"
          url="$(gh release create "${tag}" --generate-notes --target "${RELEASE_SHA}")"
          write_summary "created" "${tag}" "${latest:-none}" "${url}"
